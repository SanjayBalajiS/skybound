<div class="container animate-fade-in auth-container">
  <div class="auth-card glass-panel card">
    <div class="auth-header">
      <h2>Create Account</h2>
      <p>Join us and start booking your dream flights.</p>
    </div>

    <div *ngIf="errorMessage" class="alert alert-danger">
      {{ errorMessage }}
    </div>

    <form [formGroup]="signupForm" (ngSubmit)="onSubmit()">
      
      <div class="form-group">
        <label class="form-label" for="name">Full Name</label>
        <input type="text" id="name" formControlName="name" class="form-control" placeholder="John Doe">
        <div *ngIf="signupForm.get('name')?.touched && signupForm.get('name')?.errors?.['required']" class="error-text">
          Name is required
        </div>
        <div *ngIf="signupForm.get('name')?.touched && signupForm.get('name')?.errors?.['minlength']" class="error-text">
          Name must be at least 3 characters
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input type="email" id="email" formControlName="email" class="form-control" placeholder="you@example.com">
        <div *ngIf="signupForm.get('email')?.touched && signupForm.get('email')?.errors?.['required']" class="error-text">
          Email is required
        </div>
        <div *ngIf="signupForm.get('email')?.touched && signupForm.get('email')?.errors?.['email']" class="error-text">
          Please enter a valid email
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" formControlName="password" class="form-control" placeholder="••••••••">
        <div *ngIf="signupForm.get('password')?.touched && signupForm.get('password')?.errors?.['required']" class="error-text">
          Password is required
        </div>
        <div *ngIf="signupForm.get('password')?.touched && signupForm.get('password')?.errors?.['minlength']" class="error-text">
          Password must be at least 6 characters
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" formControlName="confirmPassword" class="form-control" placeholder="••••••••">
        <div *ngIf="signupForm.get('confirmPassword')?.touched && signupForm.hasError('mismatch')" class="error-text">
          Passwords must match
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-block" [disabled]="signupForm.invalid || loading">
        {{ loading ? 'Creating Account...' : 'Sign Up' }}
      </button>
    </form>

    <div class="auth-footer">
      <p>Already have an account? <a routerLink="/login" class="text-primary">Log in</a></p>
    </div>
  </div>
</div>
