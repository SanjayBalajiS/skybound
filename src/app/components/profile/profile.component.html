<div class="container animate-fade-in" style="max-width: 800px; margin-top: 4rem;">
  <div class="glass-panel card" *ngIf="user$ | async as user; else loadingTpl">
    <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 2rem; border-bottom: 1px solid rgba(0,0,0,0.1); padding-bottom: 1.5rem;">
      <div>
        <h2 style="color: var(--primary-color); margin: 0 0 0.5rem 0;">Account Profile</h2>
        <p style="margin: 0; color: var(--text-muted);">Manage your personal details and SkyBound Miles.</p>
      </div>
      
      <div style="text-align: right; background: rgba(96, 165, 250, 0.1); padding: 1rem 1.5rem; border-radius: 8px; border: 1px solid rgba(96, 165, 250, 0.2);">
        <div style="font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--primary-color); font-weight: bold;">SkyBound Miles</div>
        <div style="font-size: 2rem; color: #1e40af; font-weight: 800; display: flex; align-items: center; gap: 0.5rem;">
          ✈️ {{ user.miles || 0 | number }}
        </div>
      </div>
    </div>

    <form (ngSubmit)="saveProfile(user)">
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input type="text" class="form-control" name="name" [(ngModel)]="user.name" required>
        </div>

        <div class="form-group">
          <label class="form-label">Email Address (Read Only)</label>
          <input type="email" class="form-control" name="email" [ngModel]="user.email" readonly style="background: #f8fafc; color: #94a3b8; cursor: not-allowed;">
        </div>

        <div class="form-group">
          <label class="form-label">Phone Number</label>
          <input type="text" class="form-control" name="phone" [(ngModel)]="editPhone" placeholder="+1 555-0199">
        </div>

        <div class="form-group">
          <label class="form-label">Frequent Flyer Tier</label>
          <input type="text" class="form-control" name="tier" [ngModel]="getTier(user.miles || 0)" readonly style="background: #f8fafc; font-weight: bold; color: #d97706;">
        </div>
      </div>

      <div *ngIf="successMsg" class="alert alert-success" style="margin-top: 1.5rem;">
        {{ successMsg }}
      </div>

      <div style="margin-top: 2rem; text-align: right;">
        <button type="submit" class="btn btn-primary" [disabled]="saving">{{ saving ? 'Saving...' : 'Save Changes' }}</button>
      </div>
    </form>
  </div>
  
  <ng-template #loadingTpl>
    <div class="text-center" style="margin-top: 2rem;">
      <div class="loader" style="margin: 0 auto;"></div>
    </div>
  </ng-template>
</div>
