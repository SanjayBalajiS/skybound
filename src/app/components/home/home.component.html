<div class="container animate-fade-in">
  <div class="hero-section">
    <div class="hero-content">
      <h1>Let your journey begin</h1>
      <p>Discover the world with our premium airline services. Book your next flight with ease and comfort.</p>
    </div>

    <div class="search-card glass-panel">
      <h2>Search Flights</h2>
      
      <div *ngIf="searchError" class="alert alert-danger" style="padding: 0.5rem; margin-bottom: 1rem; border-radius: 4px;">
        Please enter at least one search criteria.
      </div>

      <form [formGroup]="searchForm" (ngSubmit)="onSearch()" class="search-form">
        
        <div class="form-group">
          <label class="form-label" for="airline">Airline or Flight Name (Optional)</label>
          <input type="text" id="airline" formControlName="airline" class="form-control" placeholder="e.g., Air Zenith">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="origin">From</label>
            <input type="text" id="origin" formControlName="origin" class="form-control" placeholder="e.g., London (LHR)">
          </div>

          <div class="form-group">
            <label class="form-label" for="destination">To</label>
            <input type="text" id="destination" formControlName="destination" class="form-control" placeholder="e.g., New York (JFK)">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="date">Departure Date</label>
            <input type="date" id="date" formControlName="date" class="form-control">
          </div>
          
          <div class="form-group">
            <label class="form-label" for="passengers">Passengers</label>
            <select id="passengers" formControlName="passengers" class="form-control">
              <option [value]="1">1 Adult</option>
              <option [value]="2">2 Adults</option>
              <option [value]="3">3 Adults</option>
              <option [value]="4">4 Adults</option>
              <option [value]="5">5 Adults</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="cabinClass">Cabin Class</label>
          <select id="cabinClass" formControlName="cabinClass" class="form-control">
            <option value="Economy">Economy</option>
            <option value="Business">Business Class</option>
            <option value="First">First Class (Qsuite)</option>
          </select>
        </div>

        <button type="submit" class="btn btn-primary">
          Search Flights
        </button>
      </form>
    </div>
  </div>
</div>
