<div class="container animate-fade-in" style="max-width: 800px; margin-top: 4rem;">
  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 2rem;">
    
    <!-- Left Column: Info -->
    <div>
      <h2 style="color: var(--primary-color); margin-bottom: 1rem;">Get in Touch</h2>
      <p style="color: var(--text-muted); margin-bottom: 2rem;">We are here to help 24/7. Reach out to our customer support team.</p>

      <div style="display: flex; flex-direction: column; gap: 1.5rem;">
        <div style="display: flex; align-items: flex-start; gap: 1rem;">
          <div style="font-size: 1.5rem; background: rgba(96, 165, 250, 0.1); padding: 1rem; border-radius: 50%; color: var(--primary-color);">📞</div>
          <div>
            <h4 style="margin: 0 0 0.25rem 0;">Call Us</h4>
            <p style="margin: 0; color: var(--text-muted);">+1 800-SKY-BOUND</p>
            <p style="margin: 0; font-size: 0.85rem; color: #94a3b8;">Available 24/7</p>
          </div>
        </div>

        <div style="display: flex; align-items: flex-start; gap: 1rem;">
          <div style="font-size: 1.5rem; background: rgba(96, 165, 250, 0.1); padding: 1rem; border-radius: 50%; color: var(--primary-color);">📧</div>
          <div>
            <h4 style="margin: 0 0 0.25rem 0;">Email Us</h4>
            <p style="margin: 0; color: var(--text-muted);">support&#64;skybound.example.com</p>
            <p style="margin: 0; font-size: 0.85rem; color: #94a3b8;">Replies within 2 hours</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Right Column: Form -->
    <div class="glass-panel card">
      <form (ngSubmit)="submitForm()">
        <div class="form-group">
          <label class="form-label">Name</label>
          <input type="text" class="form-control" placeholder="John Doe" required>
        </div>
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" placeholder="john@example.com" required>
        </div>
        <div class="form-group">
          <label class="form-label">Booking Reference (Optional)</label>
          <input type="text" class="form-control" placeholder="e.g. b1">
        </div>
        <div class="form-group">
          <label class="form-label">Message</label>
          <textarea class="form-control" rows="4" placeholder="How can we help you?" required></textarea>
        </div>

        <div *ngIf="successMsg" class="alert alert-success" style="margin-bottom: 1rem;">
          {{ successMsg }}
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%;" [disabled]="submitting">
          {{ submitting ? 'Sending...' : 'Send Message' }}
        </button>
      </form>
    </div>

  </div>
</div>
